name: Deploy static portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Diagnose DNS and live URLs
        if: always()
        shell: bash
        run: |
          set +e
          for host in ammarbd.cyou www.ammarbd.cyou ammar-khandoker-bd.github.io; do
            echo "===== DNS LOOKUP: $host ====="
            getent ahostsv4 "$host" || true
          done
          for url in https://ammarbd.cyou https://www.ammarbd.cyou https://ammar-khandoker-bd.github.io/Portfolio/; do
            echo "===== HTTP CHECK: $url ====="
            curl -sSIL --max-time 20 "$url" 2>&1 | head -n 12
          done
